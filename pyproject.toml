[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lsdo-motor-om"
version = "0.1.0"
description = "Native OpenMDAO implementation of LSDO Motor's TC1 PMSM models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE.txt"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "openmdao>=3.30"]

[project.optional-dependencies]
test = ["pytest>=7"]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["lsdo_motor_om*"]

[tool.setuptools.package-data]
"lsdo_motor_om.core.permeability" = ["*.tab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

